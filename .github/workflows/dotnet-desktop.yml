name: Build

on:
  push:
#    branches: [ "appointment-service", "main" ]
  pull_request:
#    branches: [ "appointment-service", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PetCarePlatform.slnx

      - name: Build
        run: dotnet build PetCarePlatform.slnx --configuration Release --no-restore

    
