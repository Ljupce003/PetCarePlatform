<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">PetCare Platform architecture</title>
  <desc id="diagram-desc">Architecture diagram showing the authenticated frontend demo caller and the trusted anonymous GitHub Copilot MCP client entering through the YARP API Gateway. The MCP server uses a privileged Keycloak service account when calling the protected Pet, Appointment, and Treatment and Notification services. Each business service owns a PostgreSQL database. Appointment verifies pet ownership through a synchronous anti-corruption layer call, registers and discovers services with Consul, and publishes appointment events through Kafka for Treatment and Notification to consume.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5d78"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7556b2"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#247a57"/>
    </marker>
    <marker id="arrow-kafka" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#bb6b16"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526078; }
      .layer { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .layer-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; fill: #526078; }
      .node-title { font-size: 19px; font-weight: 700; }
      .node-copy { font-size: 13px; fill: #46546a; }
      .edge-label { font-size: 13px; font-weight: 600; fill: #344158; }
      .small-label { font-size: 12px; font-weight: 600; fill: #526078; }
      .client { fill: #e8f1ff; stroke: #4f7ecb; stroke-width: 1.7; }
      .identity { fill: #fff3dd; stroke: #d28a20; stroke-width: 1.7; }
      .entry { fill: #f1eafe; stroke: #7556b2; stroke-width: 1.7; }
      .api-band { fill: #ede9fe; stroke: #7556b2; stroke-width: 1.5; }
      .service { fill: #e8f7ef; stroke: #2e8b62; stroke-width: 1.7; }
      .database { fill: #eef2f7; stroke: #607089; stroke-width: 1.6; }
      .infra { fill: #fff7d6; stroke: #af8b17; stroke-width: 1.7; }
      .flow { fill: none; stroke: #4b5d78; stroke-width: 2; marker-end: url(#arrow); }
      .purple-flow { fill: none; stroke: #7556b2; stroke-width: 2.2; marker-end: url(#arrow-purple); }
      .service-flow { fill: none; stroke: #247a57; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .discovery { fill: none; stroke: #607089; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .validation { fill: none; stroke: #d28a20; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-kafka); }
      .event { fill: none; stroke: #bb6b16; stroke-width: 4; marker-end: url(#arrow-kafka); }
      .db-line { fill: none; stroke: #607089; stroke-width: 2.2; marker-end: url(#arrow); }
      .legend-label { font-size: 12px; fill: #46546a; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#ffffff"/>
  <text x="48" y="48" class="title">PetCare Platform — Architecture</text>
  <text x="48" y="74" class="subtitle">Protected REST APIs, trusted administrative MCP tooling, service discovery, synchronous ACL integration, and event-driven notifications</text>

  <!-- Clients, identity and entry points -->
  <rect x="40" y="96" width="1520" height="286" rx="18" class="layer"/>
  <text x="64" y="124" class="layer-title">CLIENTS, IDENTITY AND ENTRY POINTS</text>

  <rect x="78" y="144" width="268" height="78" rx="12" class="client"/>
  <text x="212" y="176" class="node-title" text-anchor="middle">Frontend / demo caller</text>
  <text x="212" y="200" class="node-copy" text-anchor="middle">Browser · Swagger · HTTP demo</text>

  <rect x="78" y="260" width="268" height="78" rx="12" class="client"/>
  <text x="212" y="292" class="node-title" text-anchor="middle">GitHub Copilot</text>
  <text x="212" y="316" class="node-copy" text-anchor="middle">Trusted anonymous MCP client</text>

  <rect x="430" y="144" width="282" height="180" rx="12" class="identity"/>
  <text x="571" y="179" class="node-title" text-anchor="middle">Keycloak</text>
  <text x="571" y="205" class="node-copy" text-anchor="middle">OAuth 2.0 / OpenID Connect</text>
  <text x="571" y="230" class="node-copy" text-anchor="middle">Authorization Code + PKCE</text>
  <text x="571" y="255" class="node-copy" text-anchor="middle">JWT access tokens</text>
  <text x="571" y="280" class="node-copy" text-anchor="middle">owner · veterinarian · admin · service</text>

  <rect x="800" y="144" width="310" height="180" rx="12" class="entry"/>
  <text x="955" y="181" class="node-title" text-anchor="middle">YARP API Gateway</text>
  <text x="955" y="207" class="node-copy" text-anchor="middle">Protected REST + trusted MCP entry</text>
  <text x="955" y="234" class="node-copy" text-anchor="middle">/pet · /appointment · /treatment · /mcp</text>
  <text x="955" y="261" class="node-copy" text-anchor="middle">JWT on REST routes · /mcp anonymous</text>
  <text x="955" y="288" class="node-copy" text-anchor="middle">Routes requests to internal services</text>

  <rect x="1218" y="164" width="282" height="140" rx="12" class="entry"/>
  <text x="1359" y="201" class="node-title" text-anchor="middle">MCP Server</text>
  <text x="1359" y="228" class="node-copy" text-anchor="middle">Streamable HTTP · AI tools</text>
  <text x="1359" y="254" class="node-copy" text-anchor="middle">Privileged service token downstream</text>
  <text x="1359" y="280" class="node-copy" text-anchor="middle">No direct database access</text>

  <!-- Authentication and client request flows -->
  <path d="M346 163 H430" class="flow"/>
  <text x="388" y="151" class="small-label" text-anchor="middle">OIDC login</text>
  <path d="M430 202 H346" class="flow"/>
  <text x="388" y="220" class="small-label" text-anchor="middle">JWT</text>

  <path d="M712 170 H800" class="validation"/>
  <text x="756" y="157" class="small-label" text-anchor="middle">OIDC / JWKS</text>

  <path d="M346 218 V346 H856 V324" class="purple-flow"/>
  <text x="525" y="339" class="edge-label">REST + Bearer JWT</text>
  <path d="M346 334 V367 H1030 V324" class="purple-flow"/>
  <text x="530" y="361" class="edge-label">MCP over HTTP · anonymous caller</text>

  <path d="M1110 216 H1218" class="purple-flow"/>
  <text x="1164" y="203" class="small-label" text-anchor="middle">/mcp route</text>

  <!-- Business services -->
  <rect x="40" y="406" width="1520" height="438" rx="18" class="layer"/>
  <text x="64" y="434" class="layer-title">BUSINESS SERVICES / BOUNDED CONTEXTS</text>

  <rect x="176" y="458" width="1058" height="66" rx="12" class="api-band"/>
  <text x="705" y="484" class="node-title" text-anchor="middle">Protected service REST APIs</text>
  <text x="705" y="508" class="node-copy" text-anchor="middle">JWT validation · role authorization · owner/veterinarian resource scoping</text>

  <path d="M930 324 V421 H620 V458" class="purple-flow"/>
  <text x="767" y="414" class="edge-label" text-anchor="middle">YARP routes + forwarded Bearer JWT</text>
  <path d="M1359 304 V421 H1120 V458" class="purple-flow"/>
  <text x="1276" y="414" class="edge-label" text-anchor="middle">REST tools + MCP admin token</text>
  <path d="M571 324 V394 H470 V458" class="validation"/>
  <text x="516" y="388" class="small-label" text-anchor="middle">OIDC metadata / JWKS</text>

  <rect x="112" y="568" width="330" height="164" rx="14" class="service"/>
  <text x="277" y="609" class="node-title" text-anchor="middle">Pet Service</text>
  <text x="277" y="638" class="node-copy" text-anchor="middle">Owners and pets</text>
  <text x="277" y="663" class="node-copy" text-anchor="middle">Ownership authorization</text>
  <text x="277" y="688" class="node-copy" text-anchor="middle">Pet ownership ACL endpoint</text>

  <rect x="540" y="568" width="330" height="164" rx="14" class="service"/>
  <text x="705" y="609" class="node-title" text-anchor="middle">Appointment Service</text>
  <text x="705" y="638" class="node-copy" text-anchor="middle">Clinics and veterinarians</text>
  <text x="705" y="663" class="node-copy" text-anchor="middle">Availability slots</text>
  <text x="705" y="688" class="node-copy" text-anchor="middle">Booking, rescheduling and cancellation</text>

  <rect x="968" y="568" width="390" height="164" rx="14" class="service"/>
  <text x="1163" y="605" class="node-title" text-anchor="middle">Treatment &amp; Notification Service</text>
  <text x="1163" y="634" class="node-copy" text-anchor="middle">Medical examinations and vaccinations</text>
  <text x="1163" y="659" class="node-copy" text-anchor="middle">Owner and veterinarian notifications</text>
  <text x="1163" y="684" class="node-copy" text-anchor="middle">Kafka consumer and delivery worker</text>

  <path d="M360 524 V568" class="service-flow"/>
  <path d="M705 524 V568" class="service-flow"/>
  <path d="M1050 524 V568" class="service-flow"/>

  <path d="M540 647 H442" class="service-flow"/>
  <text x="491" y="620" class="edge-label" text-anchor="middle">Synchronous REST / ACL</text>
  <text x="491" y="639" class="small-label" text-anchor="middle">verify pet ownership</text>

  <!-- Databases: strict database-per-service ownership -->
  <g aria-label="Pet PostgreSQL database">
    <path d="M188 770 C188 755 366 755 366 770 V816 C366 832 188 832 188 816 Z" class="database"/>
    <ellipse cx="277" cy="770" rx="89" ry="15" class="database"/>
    <text x="277" y="791" class="node-title" text-anchor="middle" font-size="16">PostgreSQL</text>
    <text x="277" y="814" class="node-copy" text-anchor="middle">Pet database</text>
  </g>
  <g aria-label="Appointment PostgreSQL database">
    <path d="M616 770 C616 755 794 755 794 770 V816 C794 832 616 832 616 816 Z" class="database"/>
    <ellipse cx="705" cy="770" rx="89" ry="15" class="database"/>
    <text x="705" y="791" class="node-title" text-anchor="middle" font-size="16">PostgreSQL</text>
    <text x="705" y="814" class="node-copy" text-anchor="middle">Appointment database</text>
  </g>
  <g aria-label="Treatment PostgreSQL database">
    <path d="M1074 770 C1074 755 1252 755 1252 770 V816 C1252 832 1074 832 1074 816 Z" class="database"/>
    <ellipse cx="1163" cy="770" rx="89" ry="15" class="database"/>
    <text x="1163" y="791" class="node-title" text-anchor="middle" font-size="16">PostgreSQL</text>
    <text x="1163" y="814" class="node-copy" text-anchor="middle">Treatment database</text>
  </g>

  <path d="M277 732 V755" class="db-line"/>
  <path d="M705 732 V755" class="db-line"/>
  <path d="M1163 732 V755" class="db-line"/>
  <text x="291" y="749" class="small-label">EF Core</text>
  <text x="719" y="749" class="small-label">EF Core</text>
  <text x="1177" y="749" class="small-label">EF Core</text>

  <!-- Platform infrastructure -->
  <rect x="40" y="866" width="1520" height="146" rx="18" class="layer"/>
  <text x="64" y="894" class="layer-title">PLATFORM INFRASTRUCTURE</text>

  <rect x="88" y="914" width="314" height="72" rx="12" class="infra"/>
  <text x="245" y="942" class="node-title" text-anchor="middle">Consul</text>
  <text x="245" y="968" class="node-copy" text-anchor="middle">Service registry · health · discovery</text>

  <rect x="1138" y="914" width="374" height="72" rx="12" class="infra"/>
  <text x="1325" y="942" class="node-title" text-anchor="middle">Kafka broker</text>
  <text x="1325" y="968" class="node-copy" text-anchor="middle">Topic: petcare.appointments</text>

  <path d="M112 650 H70 V950 H88" class="discovery"/>
  <text x="78" y="782" class="small-label" transform="rotate(-90 78 782)">register + health</text>
  <path d="M540 700 H470 V950 H402" class="discovery"/>
  <text x="481" y="838" class="small-label" transform="rotate(-90 481 838)">register + discover Pet Service</text>

  <path d="M870 670 C1030 670 1040 950 1138 950" class="event"/>
  <text x="1016" y="837" class="edge-label" text-anchor="middle">publish appointment lifecycle events</text>
  <path d="M1325 914 V770 C1325 750 1290 750 1268 732" class="event"/>
  <text x="1370" y="835" class="edge-label" text-anchor="middle">consume events</text>
  <text x="1370" y="855" class="small-label" text-anchor="middle">create recipient notifications</text>

  <!-- Legend -->
  <g transform="translate(494 908)">
    <text x="0" y="18" class="layer-title">LINE KEY</text>
    <line x1="0" y1="42" x2="74" y2="42" class="flow"/>
    <text x="90" y="47" class="legend-label">Synchronous request / token flow</text>
    <line x1="0" y1="68" x2="74" y2="68" class="discovery"/>
    <text x="90" y="73" class="legend-label">Identity metadata / service discovery</text>
    <line x1="0" y1="94" x2="74" y2="94" class="event"/>
    <text x="90" y="99" class="legend-label">Asynchronous Kafka event flow</text>
  </g>
</svg>
