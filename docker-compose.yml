services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: petcare-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      APPOINTMENT_SERVICE_CLIENT_SECRET: appointment-secret
      TREATMENT_SERVICE_CLIENT_SECRET: treatment-secret
      MCP_SERVER_CLIENT_SECRET: mcp-secret
      API_GATEWAY_CLIENT_SECRET: gateway-secret
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/petcare-realm.json:/opt/keycloak/data/import/petcare-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g

  consul:
    image: hashicorp/consul:1.21.5
    container_name: petcare-consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    container_name: petcare-kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 8s
      timeout: 5s
      retries: 25

  kafka-init:
    image: apache/kafka:4.1.0
    container_name: petcare-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic petcare.appointments --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic petcare.appointments.dlq --partitions 3 --replication-factor 1


  pet-db:
    image: postgres:17-alpine
    container_name: petcare-pet-db
    environment:
      POSTGRES_DB: petcare_pet
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
    ports:
      - "5433:5432"
    volumes:
      - pet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare_pet"]
      interval: 5s
      timeout: 5s
      retries: 10

  appointment-db:
    image: postgres:17-alpine
    container_name: petcare-appointment-db
    environment:
      POSTGRES_DB: petcare_appointment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - appointment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petcare_appointment"]
      interval: 5s
      timeout: 5s
      retries: 10

  treatment-db:
    image: postgres:17-alpine
    container_name: petcare-treatment-db
    restart: always
    environment:
      POSTGRES_DB: treatments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5553:5432"
    volumes:
      - treatment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d treatments_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pet-service:
    image: petcare/pet-service:latest
    container_name: petcare-pet-service
    build:
      context: .
      dockerfile: PetService/PetService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Host=pet-db;Port=5432;Database=petcare_pet;Username=petcare;Password=petcare"
      Jwt__Authority: "http://keycloak:8080/realms/petcare"
      Jwt__Issuer: "http://localhost:8080/realms/petcare"
      Jwt__Audience: "petcare"
      Jwt__ClientId: "pet-service"
      Jwt__RequireHttpsMetadata: "false"
      Consul__Address: "http://consul:8500"
      ServiceRegistration__Name: "pet-service"
      ServiceRegistration__Id: "pet-service-1"
      ServiceRegistration__Address: "pet-service"
      ServiceRegistration__Port: "8080"
    ports:
      - "5101:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      pet-db:
        condition: service_healthy
      consul:
        condition: service_healthy

  appointment-service:
    image: petcare/appointment-service:latest
    container_name: petcare-appointment-service
    build:
      context: .
      dockerfile: AppointmentService/AppointmentService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Host=appointment-db;Port=5432;Database=petcare_appointment;Username=postgres;Password=postgres"
      # Logical host resolved to a healthy instance by ServiceDiscoveryHandler through Consul.
      PetService__BaseUrl: "http://pet-service"
      PetService__UseFakeVerification: "false"
      Consul__Address: "http://consul:8500"
      ServiceRegistration__Name: "appointment-service"
      ServiceRegistration__Id: "appointment-service-1"
      ServiceRegistration__Address: "appointment-service"
      ServiceRegistration__Port: "8080"
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__ClientId: "appointment-service"
      Jwt__Authority: "http://keycloak:8080/realms/petcare"
      Jwt__Issuer: "http://localhost:8080/realms/petcare"
      Jwt__Audience: "petcare"
      Jwt__ClientId: "appointment-service"
      Jwt__ClientSecret: "appointment-secret"
      Jwt__ServiceTokenRefreshSkewSeconds: "30"
      Jwt__RequireHttpsMetadata: "false"
    ports:
      - "5102:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      appointment-db:
        condition: service_healthy
      pet-service:
        condition: service_started
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  treatment-and-notification-service:
    image: petcare/treatment-and-notification-service:latest
    container_name: petcare-treatment-and-notification-service
    build:
      context: .
      dockerfile: TreatmentAndNotificationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Host=treatment-db;Port=5432;Database=treatments_db;Username=postgres;Password=mysecretpassword"
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__GroupId: "treatment-notification-service"
      Kafka__Topic: "petcare.appointments"
      Kafka__DeadLetterTopic: "petcare.appointments.dlq"
      Kafka__MaxProcessingAttempts: "3"
      Kafka__RetryDelayMilliseconds: "1000"
      Consul__Address: "http://consul:8500"
      ServiceRegistration__Name: "treatment-and-notification-service"
      ServiceRegistration__Id: "treatment-and-notification-service-1"
      ServiceRegistration__Address: "treatment-and-notification-service"
      ServiceRegistration__Port: "8080"
      Jwt__Authority: "http://keycloak:8080/realms/petcare"
      Jwt__Issuer: "http://localhost:8080/realms/petcare"
      Jwt__Audience: "petcare"
      Jwt__ClientId: "treatment-service"
      Jwt__RequireHttpsMetadata: "false"
    ports:
      - "5103:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      treatment-db:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  mcp-server:
    image: petcare/mcp-server:latest
    container_name: petcare-mcp-server
    build:
      context: .
      dockerfile: MCPServer/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      Services__PetServiceUrl: "http://pet-service:8080/"
      Services__AppointmentServiceUrl: "http://appointment-service:8080/"
      Services__TreatmentServiceUrl: "http://treatment-and-notification-service:8080/"
      Jwt__Authority: "http://keycloak:8080/realms/petcare"
      Jwt__Issuer: "http://localhost:8080/realms/petcare"
      Jwt__Audience: "petcare"
      Jwt__ClientId: "mcp-server"
      Jwt__RequireHttpsMetadata: "false"
      AllowedHosts: "localhost;127.0.0.1;mcp-server"
    ports:
      - "7001:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      pet-service:
        condition: service_started
      appointment-service:
        condition: service_started
      treatment-and-notification-service:
        condition: service_started

  api-gateway:
    image: petcare/api-gateway:latest
    container_name: petcare-api-gateway
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080

      Jwt__Authority: "http://keycloak:8080/realms/petcare"
      Jwt__Issuer: "http://localhost:8080/realms/petcare"
      Jwt__Audience: "petcare"
      Jwt__ClientId: "api-gateway"
      Jwt__RequireHttpsMetadata: "false"

      ReverseProxy__Clusters__pet-cluster__Destinations__pet-service__Address: "http://pet-service:8080/"
      ReverseProxy__Clusters__appointment-cluster__Destinations__appointment-service__Address: "http://appointment-service:8080/"
      ReverseProxy__Clusters__treatment-cluster__Destinations__treatment-service__Address: "http://treatment-and-notification-service:8080/"
      ReverseProxy__Clusters__mcp-cluster__Destinations__mcp-server__Address: "http://mcp-server:8080/"

      AllowedHosts: "localhost;127.0.0.1;api-gateway"

    ports:
      - "7000:8080"

    depends_on:
      keycloak:
        condition: service_healthy
      pet-service:
        condition: service_started
      appointment-service:
        condition: service_started
      treatment-and-notification-service:
        condition: service_started
      mcp-server:
        condition: service_started

  demo-ui:
    image: petcare/demo-ui:latest
    container_name: petcare-demo-ui
    build:
      context: ./DemoUI
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      GATEWAY_URL: "http://api-gateway:8080"
      CONSUL_URL: "http://consul:8500"
      PET_SERVICE_URL: "http://pet-service:8080"
      APPOINTMENT_SERVICE_URL: "http://appointment-service:8080"
      TREATMENT_SERVICE_URL: "http://treatment-and-notification-service:8080"
      MCP_SERVER_URL: "http://mcp-server:8080"
      UI_PUBLIC_URL: "http://localhost:8501"
    ports:
      - "8501:8501"
    depends_on:
      keycloak:
        condition: service_healthy
      consul:
        condition: service_healthy
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pet-db-data:
  appointment-db-data:
  treatment-db-data:
