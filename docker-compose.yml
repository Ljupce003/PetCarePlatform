name: petcare

services:
  postgres:
    image: postgres:17-alpine
    container_name: petcare-postgres
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare_pet
    ports:
      # 5433 on the host, so a locally installed PostgreSQL on 5432 is not in the way.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare_pet"]
      interval: 5s
      timeout: 5s
      retries: 10

  pet-service:
    image: petcare/pet-service:latest
    container_name: petcare-pet-service
    build:
      # The build context is the repository root because the API references the other layers.
      context: .
      dockerfile: PetService/PetService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=petcare_pet;Username=petcare;Password=petcare"
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
